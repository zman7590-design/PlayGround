<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#16261f" />
  <title>Terrarium — Gecko Breeder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#home" aria-label="Terrarium home"><span class="brand-mark">✳</span><span>terrarium<span class="brand-dot">.</span><small>GECKO BREEDER</small></span></a>
      <div class="season-card"><div class="season-icon">☀</div><div><span class="eyebrow">SEASON 01</span><strong>Spring hatchling</strong></div><span class="season-live"></span></div>
      <span class="nav-label">YOUR STUDIO</span>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="home"><span class="nav-icon">▦</span>Overview</button>
        <button class="nav-item" data-view="collection"><span class="nav-icon">◉</span>My geckos <span class="nav-count" id="gecko-count">5</span></button>
        <button class="nav-item" data-view="breeding"><span class="nav-icon">♡</span>Breeding lab</button>
        <button class="nav-item" data-view="market"><span class="nav-icon">⇄</span>Marketplace <span class="nav-pulse"></span></button>
        <button class="nav-item" data-view="supplies"><span class="nav-icon">▤</span>Food & habitat</button>
        <button class="nav-item" data-view="expos"><span class="nav-icon">⌖</span>Expo tour</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="care-mini"><div class="care-mini-icon">☘</div><div><strong>Daily care</strong><span id="care-status">Your crew is doing well</span></div></div>
        <button class="profile"><span class="avatar">J</span><span><strong>Jamie Parker</strong><small>Hobby breeder</small></span><span class="profile-dots">···</span></button>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar"><button class="mobile-menu" id="mobile-menu" aria-label="Open menu">☰</button><div class="breadcrumbs"><span>My studio</span><span class="crumb-slash">/</span><strong id="crumb-title">Overview</strong></div><div class="top-actions"><div class="weather"><span>☀</span> 74° <i>•</i> Mesa, AZ</div><button class="icon-button" id="help-button" aria-label="Game guide">?</button><div class="money-pill"><span class="money-icon">$</span><span id="money-display">2,480</span></div></div></header>
      <div id="view-root" class="view-root"></div>
      <footer class="app-footer"><span>✳ TERRARIUM STUDIO</span><span>A little care goes a long way.</span></footer>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script src="game.js"></script>
</body>
</html>
